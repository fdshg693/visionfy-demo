# Settings for Backend (on Cloud Run).
runConfig:
  minInstances: 0
  # cpu, memory などの設定...

# env はここ（トップレベル）に書くのがおすすめ
env:
  - variable: API_BASE_URL
    secret: visionfy-api-base-url
    # どちらで必要か明示するとより確実
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: visionfy-gemini-api-key
    # どちらで必要か明示するとより確実
    availability:
      - BUILD
      - RUNTIME
